# The registry's own declaration of itself — vendor-neutral.
#
# This file is the authority on what lanes this repository carries and what rules govern
# them. `.ascent/registry.yaml` remains beside it as Ascent's overlay: that file says how
# ONE consumer indexes this repo, this file says what the repo IS. Neither rewrites the
# other, and a reader that knows only one of them still works.
#
# Unknown fields MUST be ignored by a reader, so this file can grow without breaking old
# readers. (Same rule Ascent's overlay declares; it is the reason this repo can host more
# than one consumer at all.)

registry: 1
name: ai-registry
title: AI development registry

# Every lane is a top-level directory with its own item shape and its own governing doc.
# A consumer indexes the lanes it understands and ignores the rest.
# `depth` on a lane says whether this repository is free to reorganize its folders.
#
#   nested  — the registry owns both ends of the contract, because consumers read a
#             GENERATED index rather than walking the tree. Depth is ours to choose,
#             and knowledge/ caps every level at ten folders.
#   fixed   — a second repository selects this lane's artifacts by EXACT path length.
#             Inserting a category folder does not error there; it makes every artifact
#             silently vanish from the index, which is worse. Measured against the
#             reference consumer's indexer: skills/<name>/SKILL.md, practices/<slug>/
#             PRACTICE.md and memory/<kind>/<slug>.md are matched at exactly 3 path
#             segments, usage/<contributor>.json at exactly 2.
#
# Changing a `fixed` lane's depth is a coordinated spec bump in both repositories - the
# indexer's predicate, the scaffold, the README template and the catalog paths, in one
# deliberate change. It is entirely doable. What it must never be is a side effect of a
# folder tidy-up, which is why the reason is recorded here rather than left to be
# rediscovered.
lanes:
  knowledge:
    path: knowledge/
    holds: Reference Knowledge Bundles — four-layer domain knowledge (Golden Path →
      Technique → Application → Evidence), one bundle per domain.
    spec: docs/rkb-profile.md
    format: OKF v0.1 profile (concept documents with YAML frontmatter; `type` required)
    gate: scripts/check-bundles.mjs
    depth: nested
    # No directory under knowledge/ holds more than this many child directories. Files
    # are not counted. Enforced by scripts/lib/taxonomy.mjs via the bundle gate.
    max_child_dirs: 10
  skills:
    path: skills/
    holds: Agent skills — one directory per skill, SKILL.md plus an append-only LESSONS.md.
    spec: docs/skills-lane.md
    format: SKILL.md frontmatter (name, description, category, memory, version, tags)
    gate: scripts/check-skills.mjs
    # skills/<name>/SKILL.md — exactly 3 path segments. A category folder here would make
    # every skill vanish from a consumer's index without erroring. If this lane outgrows
    # browsing, the answer is a coordinated spec bump, not a folder move.
    depth: fixed
    # How the reference harness resolves a skill name it finds in more than one place.
    # This registry CANNOT enforce it — it cannot see a consumer's tiers — so it
    # declares the truth and the rule that follows from it, and the operator-side
    # instrument (scripts/fleet-audit.mjs) is what checks installations against it.
    resolution:
      # The harness's own order, verbatim from its documentation: "enterprise overrides
      # personal, and personal overrides project". Plugin skills are namespaced
      # (/<plugin>:<skill>) and never collide; the bare name reaches the plugin only
      # when no other source claims it. This is NOT nearest-wins, and the previous
      # declaration here ([project, user, registry]) was wrong against the harness:
      # a personal copy silently ran in six projects that carried newer copies.
      harness_order: [enterprise, personal, project, plugin]
      # The rule that makes the order irrelevant: a name that lives in this lane lives
      # NOWHERE ELSE on an installation - not in the personal tier, not as a second
      # project copy beside a plugin. Forks keep their own names.
      rule: one-home-per-name
      # Deliberately false, and this is the load-bearing line. A higher version here
      # does NOT displace any copy. If it did, merging a pull request in this
      # repository would change the behaviour of every repository that ever adopted
      # the skill, without anyone there consenting or even being present.
      version_breaks_ties_across_tiers: false
      # What a version IS for across sources: reporting staleness, never resolving it.
      # A consumer three minors behind should be told so and left alone until a human
      # updates. Merging is adopting; installing or copying is consuming. Human acts.
      version_reports_staleness: true
    # Distribution: this registry IS a plugin marketplace for the reference harness -
    # one single-skill plugin per lane skill, generated from the lane and gated.
    marketplace:
      manifest: .claude-plugin/marketplace.json
      generator: scripts/build-marketplace.mjs
      name: ai-registry
      plugin_per_skill: true
      install: "claude plugin marketplace add xkazm04/ai-registry && claude plugin install <skill>@ai-registry --scope project"
    # Per-repo overlay: a lane skill is generic; everything project-specific it needs
    # lives in the consuming repo at the location its `## Project overlay` section names
    # (default `.claude/<skill>/config.md`), and the skill runs without it.
    overlay: .claude/<skill>/config.md
    scope: Skills that transplant to any repository - the fleet's shared library. Skills
      that maintain THIS registry (`/forge`, `/deepen`, `/librarian`, `/intake`) live in
      `.claude/skills/` and are not part of this lane.
    note: The shared library migrated into this lane on 2026-08-22 (22 skills from the
      Personas workspace library and the connected projects, canonical bodies chosen on
      evidence, project specifics moved to overlays). Six of the original worked-example
      skills remain because they are real and generic.
  practices:
    path: practices/
    holds: Practices — the shape of a repo-level habit plus the starter artifacts it drops.
    depth: fixed   # practices/<slug>/PRACTICE.md — 3 segments, matched exactly
  memory:
    path: memory/
    holds: Organizational memory notes, one fact per file, kind-partitioned.
    depth: fixed   # memory/<kind>/<slug>.md — 3 segments, matched exactly
  usage:
    path: usage/
    depth: fixed   # usage/<contributor>.json — 2 segments, matched exactly
    holds: Which skills actually get used — counts contributed by the installations that
      run them. One file per contributing installation, aggregated into catalog.json.
    spec: docs/usage-lane.md
    gate: scripts/check-usage.mjs
    note: Counts and nothing else. No paths, project names, URLs or addresses — the gate
      enforces it rather than trusting contributors, because this repository is public and
      a leak in git history is permanent.
  signals:
    path: signals/
    holds: Whether what this registry claims is still true where it is used — stack
      versions, citation-resolution verdicts, deviations and consults, contributed by the
      installations that consume the knowledge lane. One file per installation.
    spec: docs/signals-lane.md
    gate: scripts/check-signals.mjs
    depth: fixed   # signals/<contributor>.json — one file per installation, never nested
    # The registry cannot resolve a citation: it does not have the consumer's checkout.
    # That is the same constraint that put the evidence layer in a consumer-local overlay,
    # so this lane takes the same shape — the consumer computes, the registry receives
    # VERDICTS and never pointers. `{"gone": 2}` is the finding; which two files vanished
    # is a fact about one tree and stays there.
    note: Counts and registry-owned slugs only, under the same privacy gate as usage/. A
      bundle no installation reports on reads as UNKNOWN, never as current.
  librarian:
    path: librarian/
    holds: Coverage memory for the maintenance loop — what the registry looked like when
      it was last swept, what was done about it, and what was deliberately not done.
      An Obsidian-navigable vault of markdown notes.
    spec: .claude/skills/librarian/SKILL.md
    depth: nested
    # Deliberately holds no counts a script can recompute. `librarian-scan.mjs` produces
    # those fresh every run — a carried-forward derived number drifts silently, and
    # nobody notices until a decision rests on one. A figure in a note is a RECORD of
    # what was true at that sweep, never an input to the next.
    note: Public-safe by rule, like usage/ and signals/ — scores, slugs and dates, never
      a consumer's paths.

# What a reader may assume about content in this repo.
guarantees:
  # Nothing published here points into a private tree. Consumers that need dense pointers
  # into their own codebase keep them in gitignored local overlays (see the knowledge
  # lane's spec, §5) — the published standard never carries them.
  no_internal_references: true
  # Git is the door for content. A tool indexes and proposes; a human merges. Merging is
  # adopting; see CODEOWNERS.
  write_path: pull-request
  # Additive-within-major. A new optional field is not a breaking change; a reader must
  # ignore what it does not recognize.
  compatibility: additive
  # Every count published here is an aggregate over a time window. Nothing in this repo
  # records who ran what, or in which repository — that is a fact about one organization's
  # fleet and it stays there.
  usage_is_aggregate_only: true
  # An application document carries the DATE its citations were last resolved against a
  # real tree (`verified_on`). The expiry is derived from it per stack by
  # scripts/check-currency.mjs, so the policy lives in one tunable place instead of in
  # hundreds of invented per-file dates. A claim with no age cannot be triaged.
  applications_carry_an_age: true

owners:
  - xkazm04
