<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" aria-labelledby="f7t f7d">
  <title id="f7t">One published number, many counters</title>
  <desc id="f7d">A single published limit of N per minute fans out into two groups of independent counters: one per Envoy process, configured with max_tokens, tokens_per_fill and fill_interval in released version 1.40.0, and one per Cloudflare data center, because cf.colo.id is added to every rule, with co-located data centers sharing one. The arrows converge on one resource, which can admit up to the sum of the counters. A tag labels that sum Derived, holding only where the counters are parallel and independent, and a side note records that counters can lag a few seconds.</desc>
  <style>
    .bg{fill:#f6f4ef}
    .t{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1b1b19}
    .n{font-size:15px}
    .d{font-size:13px;fill:#3a3a36}
    .h{font-size:13px;fill:#57534d;letter-spacing:.04em}
    .sm{font-size:13px;fill:#57534d}
    .box{fill:#ffffff;stroke:#8a8076;stroke-width:1.5}
    .group{fill:#ffffff;stroke:#8a8076;stroke-width:1.3}
    .arr{stroke:#57534d;stroke-width:1.3;fill:none}
    .arrh{fill:#57534d}
    .bluebox{fill:#e7eef4;stroke:#1f4e79;stroke-width:1.5}
    .bluet{fill:#1f4e79}
    .bucketa{fill:#1f4e79}
    .bucketb{fill:#a4262c}
    .notebox{fill:#eceae4;stroke:#8a8076;stroke-width:1.5}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1c1c1a}
      .t{fill:#e9e6df}
      .d{fill:#cfcac0}
      .h,.sm{fill:#a9a397}
      .box{fill:#121212;stroke:#7d776c}
      .group{fill:#121212;stroke:#7d776c}
      .arr{stroke:#a9a397}
      .arrh{fill:#a9a397}
      .bluebox{fill:#16303f;stroke:#8ec2e8}
      .bluet{fill:#8ec2e8}
      .bucketa{fill:#8ec2e8}
      .bucketb{fill:#ef8e8e}
      .notebox{fill:#26251f;stroke:#7d776c}
    }
  </style>
  <rect class="bg" width="680" height="370"/>

  <rect class="bluebox" x="240" y="20" width="200" height="40"/>
  <text class="t n bluet" x="340" y="45" text-anchor="middle">published: N per minute</text>

  <rect class="bluebox" x="520" y="20" width="140" height="24"/>
  <text class="t d bluet" x="590" y="37" text-anchor="middle">Derived: the sum below</text>

  <path class="arr" d="M300 60 C 300 90, 170 90, 170 112"/>
  <path class="arr" d="M380 60 C 380 90, 510 90, 510 112"/>
  <polygon class="arrh" points="170,120 165,108 175,108"/>
  <polygon class="arrh" points="510,120 505,108 515,108"/>

  <rect class="group" x="30" y="122" width="280" height="130"/>
  <text class="t n" x="44" y="144">per Envoy process, v1.40.0</text>
  <text class="t d" x="44" y="164">max_tokens, tokens_per_fill, fill_interval</text>
  <rect class="bucketa" x="44" y="180" width="34" height="42" rx="4"/>
  <rect class="bucketa" x="94" y="180" width="34" height="42" rx="4"/>
  <rect class="bucketa" x="144" y="180" width="34" height="42" rx="4"/>
  <rect class="bucketa" x="194" y="180" width="34" height="42" rx="4"/>
  <text class="t d" x="240" y="206">one bucket each</text>

  <rect class="group" x="370" y="122" width="280" height="130"/>
  <text class="t n" x="384" y="144">per data center</text>
  <text class="t d" x="384" y="164">cf.colo.id added to every rule</text>
  <rect class="bucketb" x="384" y="180" width="34" height="42" rx="4"/>
  <rect class="bucketb" x="434" y="180" width="34" height="42" rx="4"/>
  <rect class="bucketb" x="484" y="180" width="34" height="42" rx="4"/>
  <rect class="bucketb" x="534" y="180" width="34" height="42" rx="4"/>
  <text class="t d" x="580" y="206">counters lag</text>

  <path class="arr" d="M170 252 C 170 286, 300 286, 300 302"/>
  <path class="arr" d="M510 252 C 510 286, 380 286, 380 302"/>
  <polygon class="arrh" points="300,310 295,298 305,298"/>
  <polygon class="arrh" points="380,310 375,298 385,298"/>

  <rect class="notebox" x="180" y="312" width="320" height="38"/>
  <text class="t n" x="340" y="336" text-anchor="middle">one resource: up to the sum</text>

  <text class="sm" x="20" y="290">sum holds for parallel, independent counters</text>
  <text class="sm" x="660" y="364" text-anchor="end">sources [12][13][27]</text>
</svg>
