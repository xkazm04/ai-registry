<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-labelledby="f6t f6d">
  <title id="f6t">The same Wikimedia traffic measured on two steps</title>
  <desc id="f6d">Bar chart with two groups. Measured on total pageviews, bots are about 35 percent and everything else about 65 percent. Measured on resource-consuming requests reaching the core datacenters, bots are at least 65 percent and everything else at most 35 percent. The two groups have different populations, so they are not two readings of one quantity. Reported 2025-04-01.</desc>
  <style>
    .bg{fill:#f6f4ef}
    .t{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1b1b19}
    .n{font-size:15px}
    .d{font-size:13px;fill:#3a3a36}
    .h{font-size:13px;fill:#57534d;letter-spacing:.04em}
    .sm{font-size:13px;fill:#57534d}
    .grid{stroke:#d6d1c7;stroke-width:1}
    .barblue{fill:#1f4e79}
    .barred{fill:#a4262c}
    .barrest{fill:#ffffff;stroke:#8a8076;stroke-width:1.3}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1c1c1a}
      .t{fill:#e9e6df}
      .d{fill:#cfcac0}
      .h,.sm{fill:#a9a397}
      .grid{stroke:#3e3b35}
      .barblue{fill:#8ec2e8}
      .barred{fill:#ef8e8e}
      .barrest{fill:#121212;stroke:#7d776c}
    }
  </style>
  <rect class="bg" width="680" height="320"/>

  <text class="t h" x="20" y="26">SHARE OF THE STEP, PERCENT</text>

  <line class="grid" x1="200" y1="44" x2="200" y2="244"/>
  <line class="grid" x1="310" y1="44" x2="310" y2="244"/>
  <line class="grid" x1="420" y1="44" x2="420" y2="244"/>
  <line class="grid" x1="530" y1="44" x2="530" y2="244"/>
  <line class="grid" x1="640" y1="44" x2="640" y2="244"/>
  <text class="sm" x="200" y="262" text-anchor="middle">0</text>
  <text class="sm" x="310" y="262" text-anchor="middle">25</text>
  <text class="sm" x="420" y="262" text-anchor="middle">50</text>
  <text class="sm" x="530" y="262" text-anchor="middle">75</text>
  <text class="sm" x="640" y="262" text-anchor="middle">100</text>

  <text class="t n" x="20" y="66">step: total pageviews</text>
  <rect class="barblue" x="200" y="78" width="154" height="26"/>
  <text class="t d" x="362" y="96">bots, about 35</text>
  <rect class="barrest" x="200" y="110" width="286" height="26"/>
  <text class="t d" x="494" y="128">everything else, about 65</text>

  <text class="t n" x="20" y="176">step: resource-consuming</text>
  <text class="t n" x="20" y="194">requests, core datacenters</text>
  <rect class="barred" x="200" y="162" width="286" height="26"/>
  <text class="t d" x="494" y="180">bots, at least 65</text>
  <rect class="barrest" x="200" y="194" width="154" height="26"/>
  <text class="t d" x="362" y="212">everything else, at most 35</text>

  <text class="sm" x="20" y="290">two populations, not two readings of one quantity</text>
  <text class="sm" x="20" y="308">reported 2025-04-01</text>
  <text class="sm" x="660" y="308" text-anchor="end">source [22]</text>
</svg>
