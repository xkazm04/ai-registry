<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img">
<style>
:root{--bg:#fbfaf7;--fg:#1a1a18;--mut:#55554f;--line:#3c3c3c;--red:#a32b1c;--blue:#1d4e89}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#eceae4;--mut:#aaa89f;--line:#b9b7ae;--red:#f0a08f;--blue:#92b8ea}}
text{font-family:Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-size:16px;font-weight:bold}
.h{font-size:14px;font-weight:bold}
.s{font-size:13px}
.m{fill:var(--mut);font-size:13px}
</style>
<rect x="0" y="0" width="760" height="334" fill="var(--bg)"/>
<text x="24" y="26" class="t">Container restarts in the first ten minutes of a crash loop</text>
<text x="736" y="26" text-anchor="end" class="m">[22], [23]</text>

<text x="24" y="66" class="h" fill="var(--blue)">kubelet default: 10 s, 20 s, 40 s, cap 300 s</text>
<line x1="100" y1="120" x2="700" y2="120" stroke="var(--blue)" stroke-width="1.6"/>
<g stroke="var(--blue)" stroke-width="3">
<line x1="110" y1="100" x2="110" y2="120"/>
<line x1="130" y1="100" x2="130" y2="120"/>
<line x1="170" y1="100" x2="170" y2="120"/>
<line x1="250" y1="100" x2="250" y2="120"/>
<line x1="410" y1="100" x2="410" y2="120"/>
</g>
<text x="430" y="96" class="s" fill="var(--blue)">5 restarts in ten minutes</text>
<text x="430" y="140" class="m">resets only after 10 min healthy</text>

<text x="24" y="190" class="h" fill="var(--red)">alpha proposal: 1 s initial, cap 60 s</text>
<line x1="100" y1="244" x2="700" y2="244" stroke="var(--red)" stroke-width="1.6"/>
<g stroke="var(--red)" stroke-width="3">
<line x1="101" y1="224" x2="101" y2="244"/>
<line x1="103" y1="224" x2="103" y2="244"/>
<line x1="107" y1="224" x2="107" y2="244"/>
<line x1="115" y1="224" x2="115" y2="244"/>
<line x1="131" y1="224" x2="131" y2="244"/>
<line x1="163" y1="224" x2="163" y2="244"/>
<line x1="223" y1="224" x2="223" y2="244"/>
<line x1="283" y1="224" x2="283" y2="244"/>
<line x1="343" y1="224" x2="343" y2="244"/>
<line x1="403" y1="224" x2="403" y2="244"/>
<line x1="463" y1="224" x2="463" y2="244"/>
<line x1="523" y1="224" x2="523" y2="244"/>
<line x1="583" y1="224" x2="583" y2="244"/>
<line x1="643" y1="224" x2="643" y2="244"/>
</g>
<text x="330" y="216" class="s" fill="var(--red)">14 restarts in ten minutes</text>
<text x="330" y="264" class="m">about 10x pod state-transition requests, modelled</text>

<line x1="100" y1="300" x2="700" y2="300" stroke="var(--line)" stroke-width="1.4"/>
<line x1="100" y1="296" x2="100" y2="306" stroke="var(--line)"/>
<line x1="220" y1="296" x2="220" y2="306" stroke="var(--line)"/>
<line x1="400" y1="296" x2="400" y2="306" stroke="var(--line)"/>
<line x1="700" y1="296" x2="700" y2="306" stroke="var(--line)"/>
<text x="100" y="320" text-anchor="middle" class="m">0</text>
<text x="220" y="320" text-anchor="middle" class="m">2 min</text>
<text x="400" y="320" text-anchor="middle" class="m">5 min</text>
<text x="700" y="320" text-anchor="middle" class="m">10 min</text>
</svg>
