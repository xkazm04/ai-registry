<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img">
<style>
:root{--bg:#fbfaf7;--fg:#1a1a18;--mut:#55554f;--line:#3c3c3c;--red:#a32b1c;--redi:#ffffff;--green:#1f6f54;--greeni:#ffffff;--r1:#f7e6e2;--r2:#f4ddd7;--r3:#f0d2ca;--r4:#eac2b8;--r5:#e2ac9f;--g1:#d2e6dc;--g2:#e6f0ea}
@media (prefers-color-scheme:dark){:root{--bg:#16161a;--fg:#eceae4;--mut:#aaa89f;--line:#b9b7ae;--red:#f0a08f;--redi:#16161a;--green:#80d1b0;--greeni:#16161a;--r1:#2a1d1b;--r2:#33211e;--r3:#3d2621;--r4:#482b24;--r5:#553127;--g1:#1b3129;--g2:#152a23}}
text{font-family:Helvetica,Arial,sans-serif;fill:var(--fg)}
.t{font-size:16px;font-weight:bold}
.h{font-size:14px;font-weight:bold}
.l{font-size:14px}
.s{font-size:13px}
.m{fill:var(--mut);font-size:13px}
.rb{stroke:var(--red);stroke-width:1.2}
.gb{stroke:var(--green);stroke-width:1.2}
</style>
<rect x="0" y="0" width="760" height="340" fill="var(--bg)"/>
<text x="24" y="28" class="t">A count multiplies down a stack; a ratio bounds one client</text>
<text x="736" y="28" text-anchor="end" class="m">[2], [4]</text>

<text x="200" y="62" text-anchor="middle" class="h" fill="var(--red)">3 attempts at each of 5 layers</text>
<rect x="165" y="74" width="70" height="34" fill="var(--r1)" class="rb"/>
<text x="200" y="96" text-anchor="middle" class="s">3x</text>
<rect x="150" y="116" width="100" height="34" fill="var(--r2)" class="rb"/>
<text x="200" y="138" text-anchor="middle" class="s">9x</text>
<rect x="130" y="158" width="140" height="34" fill="var(--r3)" class="rb"/>
<text x="200" y="180" text-anchor="middle" class="s">27x</text>
<rect x="105" y="200" width="190" height="34" fill="var(--r4)" class="rb"/>
<text x="200" y="222" text-anchor="middle" class="s">81x</text>
<rect x="75" y="242" width="250" height="34" fill="var(--r5)" class="rb"/>
<text x="200" y="264" text-anchor="middle" class="s" font-weight="bold">243x</text>
<rect x="75" y="292" width="250" height="38" rx="4" fill="var(--red)"/>
<text x="200" y="316" text-anchor="middle" class="l" fill="var(--redi)" font-weight="bold">database sees 243x</text>

<line x1="390" y1="60" x2="390" y2="330" stroke="var(--mut)" stroke-width="1" stroke-dasharray="4 5"/>

<text x="440" y="62" class="h" fill="var(--green)">one client at one layer</text>

<text x="440" y="110" class="s">3 attempts per request, no budget</text>
<rect x="440" y="120" width="251" height="30" fill="var(--g2)" class="gb"/>
<text x="451" y="141" class="s">just under 3x of its own request rate</text>

<text x="440" y="196" class="s">plus retries held under 10 percent of its requests</text>
<rect x="440" y="206" width="95" height="30" fill="var(--g1)" class="gb"/>
<text x="451" y="227" class="s" font-weight="bold">about 1.1x</text>

<line x1="440" y1="262" x2="700" y2="262" stroke="var(--line)" stroke-width="1.4"/>
<line x1="440" y1="258" x2="440" y2="266" stroke="var(--line)"/>
<line x1="527" y1="258" x2="527" y2="266" stroke="var(--line)"/>
<line x1="613" y1="258" x2="613" y2="266" stroke="var(--line)"/>
<line x1="700" y1="258" x2="700" y2="266" stroke="var(--line)"/>
<text x="440" y="282" text-anchor="middle" class="m">0</text>
<text x="527" y="282" text-anchor="middle" class="m">1x</text>
<text x="613" y="282" text-anchor="middle" class="m">2x</text>
<text x="700" y="282" text-anchor="middle" class="m">3x</text>
<text x="440" y="316" class="m">that client's own attempted traffic</text>
</svg>
