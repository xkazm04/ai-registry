name: recipes

on:
  push:
    branches: [main]
    paths: ['recipes/**', 'scripts/**', 'docs/recipes-lane.md', 'registry.yaml', '.github/workflows/recipes.yml']
  pull_request:
    paths: ['recipes/**', 'scripts/**', 'docs/recipes-lane.md', 'registry.yaml', '.github/workflows/recipes.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape:
    name: recipe shape and index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: node scripts/gate.mjs --lane recipes

  version:
    name: recipe version discipline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: node scripts/check-recipes.mjs --since "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
