name: registry

# This workflow has no path filter: every published input and governing contract
# reaches the same validation plan used locally. Older workflow job names remain
# available for existing branch-protection configurations.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: complete registry contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: node scripts/gate.mjs --all
      - name: Version discipline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/check-skills.mjs --since "$BASE_SHA"
          node scripts/check-recipes.mjs --since "$BASE_SHA"
