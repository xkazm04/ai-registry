name: skills

# Gates the skills/ lane (docs/skills-lane.md).
#
# Two jobs, deliberately separate, for the same reason knowledge.yml splits its own:
# `shape` says the frontmatter contract holds and the lane is still ASCII; `version`
# says the change carries the one signal every consumer's sync decision reads. A stale
# version is not a shape defect, and conflating the two makes people re-run the wrong
# thing.
#
# `version` runs on pull requests only. It compares against the merge base, which a push
# to main does not have — and by then the decision it guards has already been made.
#
# ACTIONS ARE PINNED BY COMMIT, NOT BY TAG. `actions/checkout@v4` is a moving name: it is
# an agreement to run whatever that publisher pushes to the tag next, resolved at build
# time, with no review step between their push and our execution. A third-party action is
# a dependency that runs inside the job with the job's identity - the narrowest tier of the
# injected-code ladder, and still a party with execution privilege here. The trailing
# comment carries the human-readable version; the SHA is what actually resolves.
#
# Pinning to a digest also freezes the deprecation clock, so the pin moved to the current
# major rather than freezing v4 - which was three majors behind and already emitting a
# Node 20 deprecation on every run. Bump deliberately, by resolving the tag again.
on:
  push:
    branches: [main]
    paths: ['skills/**', '.claude-plugin/**', 'scripts/check-skills.mjs', 'scripts/build-marketplace.mjs', 'scripts/lib/skills-lane.mjs', '.github/workflows/skills.yml']
  pull_request:
    paths: ['skills/**', '.claude-plugin/**', 'scripts/check-skills.mjs', 'scripts/build-marketplace.mjs', 'scripts/lib/skills-lane.mjs', '.github/workflows/skills.yml']
  workflow_dispatch:

jobs:
  shape:
    name: skill shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # No install step: the gate is dependency-free by design.
      - name: Check the skills lane
        run: node scripts/check-skills.mjs
      # The marketplace manifest is a GENERATED view over the lane (one plugin per skill,
      # version copied from frontmatter). A stale manifest ships the wrong version to every
      # installation that updates, so freshness is gated like the catalog's.
      - name: Check the plugin marketplace is fresh
        run: node scripts/build-marketplace.mjs --check

  version:
    name: version discipline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs against the merge base. A shallow clone cannot resolve it,
          # and the checker exits 2 rather than reporting "no version problems" from a
          # comparison that never ran.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check every changed skill carries a version bump
        run: node scripts/check-skills.mjs --since "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
