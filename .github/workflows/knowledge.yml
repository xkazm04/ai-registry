name: knowledge

# Gates the knowledge/ lane on every change that can affect it.
#
# Three jobs, deliberately separate: `bundles` says the four-layer contract holds and no
# consumer-internal evidence leaked; `index` says each bundle's index.json still matches
# its markdown; `catalog` says the generated top-level index still matches the content it
# indexes. A stale artifact is not a content defect, and conflating the two makes people
# re-run the wrong thing.
#
# Regeneration ORDER matters when a bundle changes: `build-index.mjs` first (it writes a
# file inside the bundle), then `build-catalog.mjs` (whose content hash covers it). The
# reverse order produces a catalog that is stale the moment it is written.
#
# ACTIONS ARE PINNED BY COMMIT, NOT BY TAG. `actions/checkout@v4` is a moving name: it is
# an agreement to run whatever that publisher pushes to the tag next, resolved at build
# time, with no review step between their push and our execution. A third-party action is
# a dependency that runs inside the job with the job's identity - the narrowest tier of the
# injected-code ladder, and still a party with execution privilege here. The trailing
# comment carries the human-readable version; the SHA is what actually resolves.
#
# Pinning to a digest also freezes the deprecation clock, so the pin moved to the current
# major rather than freezing v4 - which was three majors behind and already emitting a
# Node 20 deprecation on every run. Bump deliberately, by resolving the tag again.
on:
  push:
    branches: [main]
    paths: ['knowledge/**', 'usage/**', 'signals/**', 'scripts/**', 'catalog.json', '.github/workflows/knowledge.yml']
  pull_request:
    paths: ['knowledge/**', 'usage/**', 'signals/**', 'scripts/**', 'catalog.json', '.github/workflows/knowledge.yml']
  workflow_dispatch:
  # The citation sweep below is the only check here whose subject is OUTSIDE this
  # repository, so it is the only one whose result can change with no commit. A
  # change-triggered gate cannot see that class at all; a clock can.
  #
  # The weekly tick also runs every other job, and that is the point rather than a
  # side effect: a workflow that only ever runs on changes has no heartbeat, so a
  # gate decommissioned from outside — a withdrawn runner, a pinned action that
  # stops resolving — is indistinguishable from a quiet week. A dated run in the
  # history is the cheapest surface on which that decays visibly.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  bundles:
    name: bundle integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # No install step: the gate is dependency-free by design.
      - name: Check bundle integrity
        run: node scripts/check-bundles.mjs

  index:
    name: bundle index freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check each bundle's index is current
        run: node scripts/build-index.mjs --check

      # The knowledge rules are a generated VIEW over the bundle indexes and are linked
      # into every project's .claude/rules/, where they load in every session. A stale
      # rule advertises subjects that moved or no longer exist.
      - name: Check the generated knowledge rules are fresh
        run: node scripts/build-knowledge-rules.mjs --check

  usage:
    name: usage lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # Runs BEFORE catalog in intent (jobs are parallel, but a usage failure is
      # the one to read first): the catalog aggregates this lane, so a bad usage
      # file shows up there as a wrong number rather than as an error.
      - name: Check the usage lane
        run: node scripts/check-usage.mjs

  signals:
    name: signals lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # Same privacy contract as the usage lane, enforced the same way. A registry nobody
      # reports to yet passes: absence is a legitimate state, not a finding.
      - name: Check the signals lane
        run: node scripts/check-signals.mjs

  currency:
    name: currency report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # REPORTS, never fails. A stale document must not block an unrelated pull request —
      # that is how a gate ends up deleted. The failing form (`--fail-on-expired`) belongs
      # to a scheduled run and to /librarian, where a red result is the point and nobody
      # is standing behind it waiting to merge.
      - name: Report knowledge currency
        run: node scripts/check-currency.mjs
      # Same contract: the maintenance scorecard is published on every change so the
      # trend is visible in CI history without anyone running a sweep.
      - name: Report the maintenance scorecard
        run: node scripts/librarian-scan.mjs --top 10

  citations:
    name: external citation liveness
    # ADVISORY, and scheduled rather than change-triggered. Two reasons, both
    # structural rather than a matter of taste:
    #
    # 1. Its subject is outside this repository. Every other job here answers a
    #    question about content in the checkout, so a change is the right trigger.
    #    An external citation dies when a third party reorganises a website - no
    #    commit, no diff, and `verified_on` beside it goes on asserting a
    #    resolution that is no longer true. Only a clock catches that.
    # 2. It makes ~170 outbound requests. On every pull request that is both slow
    #    and self-defeating: the hosts that matter most start returning 429, and a
    #    check that is flaky on the merge path is a check somebody deletes.
    #
    # It never fails the build. A citation that answered 403 was REFUSED, not
    # removed, and on this corpus 20 of the 21 non-2xx responses are that class -
    # failing on them would delete good citations at a 95% false rate. Deletion is
    # a human decision made from the report, which is why this job only reports.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Report external citation liveness
        run: node scripts/check-citations.mjs

  catalog:
    name: catalog freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # Before asking whether the catalog is current, assert that "current" means the
      # same thing here as on the machine that wrote it. The digest hashed raw bytes
      # once, which made it a property of the checkout's line endings — this job then
      # failed for every commit written from a CRLF clone, indistinguishably from real
      # staleness.
      - name: Check the bundle digest is checkout-stable
        run: node scripts/check-hash-stability.mjs
      - name: Check catalog is current
        run: node scripts/build-catalog.mjs --check
